name: "Coolify ENV Fetcher"
description: "Fetch ENV from coolify project and save it as .env"
inputs:
  base-url:
    description: "Base URL of coolify"
    required: true
  access-token:
    description: "Access Token"
    required: true
  app-id:
    description: "Your Application ID"
    required: true
  is-preview:
    description: "Should fetch preview ENV? Put 'true' if want to get the preview ENV"
    required: false
    default: "false"

runs:
  using: "docker"
  image: "docker://secondculs/coolify-env-fetcher:1"
  args:
    - ${{ inputs.base-url }}
    - ${{ inputs.access-token }}
    - ${{ inputs.app-id }}
    - ${{ inputs.is-preview }}
